<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Отзывы</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Стили для формы */
        .rating { display: flex; flex-direction: row-reverse; justify-content: center; gap: 5px; margin: 10px 0; }
        .rating input { display: none; }
        .rating label { cursor: pointer; color: #ccc; transition: color 0.2s; }
        .rating input:checked ~ label, .rating label:hover, .rating label:hover ~ label { color: #ffc73a; }
        .rating svg { width: 35px; height: 35px; fill: currentColor; }
        
        /* Исправление расположения блока */
        .form-container { width: 100%; max-width: 500px; margin: 0 auto; }
        input, textarea { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #d4b59d; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="form-container">
        <form id="review-form" action="/add-review" method="POST">
            <label>Ваше имя / Discord:</label>
            <input type="text" name="username" required>
            
            <label>Код подтверждения покупки:</label>
            <input type="text" name="code" required>

            <label class="block text-center font-bold">Ваша оценка:</label>
            <div class="rating">
                <input type="radio" id="s5" name="rating" value="5" checked><label for="s5"><svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></label>
                <input type="radio" id="s4" name="rating" value="4"><label for="s4"><svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></label>
                <input type="radio" id="s3" name="rating" value="3"><label for="s3"><svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></label>
                <input type="radio" id="s2" name="rating" value="2"><label for="s2"><svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></label>
                <input type="radio" id="s1" name="rating" value="1"><label for="s1"><svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></label>
            </div>

            <label>Ваш отзыв:</label>
            <textarea name="text" rows="4" required></textarea>
            
            <button type="submit">Отправить отзыв</button>
        </form>
    </div>
</body>
</html>
