<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Отзывы — Art Shop</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #c084fc;
            margin-bottom: 10px;
        }
        p.desc {
            color: #94a3b8;
            margin-bottom: 30px;
            text-align: center;
        }
        .form-container, .review-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 15px;
            background-color: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            background-color: #9333ea;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #7e22ce;
        }
        .review-card h3 {
            margin-top: 0;
            color: #f1f5f9;
        }
        .review-card p {
            margin-bottom: 0;
            color: #cbd5e1;
        }
    </style>
</head>
<body>

    <h1>⭐ Отзывы наших клиентов</h1>
    <p class="desc">Здесь вы можете почитать реальные отзывы покупателей Art Shop или оставить свой.</p>

    <div class="form-container">
        <!-- Блок для вывода ошибок -->
        {% if error %}
            <div style="background-color: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #f87171; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-weight: bold;">
                {{ error }}
            </div>
        {% endif %}

        <form action="/add-review" method="POST">
            <label for="username">Ваше имя / Discord:</label>
            <input type="text" id="username" name="username" placeholder="@username" required>

            <label for="text">Ваш отзыв:</label>
            <textarea id="text" name="text" rows="4" placeholder="Напишите пару слов о магазине..." required></textarea>

            <button type="submit">Отправить отзыв</button>
        </form>
    </div>

    <!-- Список отзывов -->
    {% for review in reviews %}
        <div class="review-card">
            <h3>{{ review.username }}</h3>
            <p>{{ review.text }}</p>
        </div>
    {% endfor %}

</body>
</html>
