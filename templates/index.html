<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art Shop — Store</title>
    <style>
        :root {
            --primary: #7c3aed;
            --bg-dark: #0f0e17;
            --card-bg: #1a1926;
            --text-light: #fffffe;
            --text-muted: #a7a9be;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 100px; /* Отступ для панели */
        }

        /* Панель навигации (Dock) */
        .dock {
            position: fixed;
            bottom: 20px;
            background: rgba(15, 14, 23, 0.8);
            backdrop-filter: blur(10px);
            padding: 10px;
            border-radius: 20px;
            display: flex;
            gap: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 999;
        }

        .dock-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            color: #fff;
            transition: 0.3s;
        }
        .dock-btn:hover { background: var(--primary); border-color: var(--primary); }

        /* Остальные стили (оставляем как были) */
        .container { width: 90%; max-width: 450px; margin-top: 20px; }
        .discord-profile { background: #111018; border-radius: 20px; border: 1px solid rgba(124, 58, 237, 0.3); margin-bottom: 25px; }
        .profile-banner { height: 90px; background: linear-gradient(135deg, #7c3aed, #3b82f6); border-radius: 20px 20px 0 0; }
        .profile-body { padding: 0 20px 20px 20px; }
        .profile-avatar { width: 80px; height: 80px; border-radius: 50%; border: 4px solid #111018; margin-top: -45px; margin-bottom: 12px; object-fit: cover; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 20px; margin-bottom: 20px; }
        button { width: 100%; padding: 12px; background: var(--primary); border: none; border-radius: 10px; color: white; font-weight: bold; cursor: pointer; }
        #receiptBox { display: none; margin-top: 20px; padding: 20px; background: #161522; border-radius: 20px; }
        #authModal { position: fixed; inset: 0; background: rgba(5, 5, 9, 0.9); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .auth-card { background: var(--card-bg); padding: 30px; border-radius: 20px; width: 90%; max-width: 380px; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0 15px 0; background: #050509; border: 1px solid var(--primary); border-radius: 10px; color: white; box-sizing: border-box; }
    </style>
</head>
<body>

    <!-- ПАНЕЛЬ НАВИГАЦИИ -->
    <div class="dock">
        <button class="dock-btn" onclick="location.reload()">🏠</button>
        <button class="dock-btn" onclick="alert('Поиск в разработке')">🔍</button>
        <button class="dock-btn" onclick="alert('Почта пуста')">✉️</button>
        <button class="dock-btn" onclick="alert('Галерея')">📷</button>
        <button class="dock-btn" onclick="alert('Избранное')">⭐</button>
        <button class="dock-btn" onclick="document.querySelector('.discord-profile').scrollIntoView({behavior:'smooth'})">👤</button>
        <button class="dock-btn" onclick="alert('Настройки')">⚙️</button>
    </div>

    <!-- ОСТАЛЬНОЙ КОНТЕНТ -->
    <div id="authModal">
        <div class="auth-card">
            <h2>Регистрация</h2>
            <input type="text" id="regUsername" placeholder="Никнейм">
            <input type="text" id="regAvatar" placeholder="URL Аватарки">
            <textarea id="regBio" placeholder="Статус"></textarea>
            <button onclick="registerUser()">Войти</button>
        </div>
    </div>

    <div class="container">
        <div class="discord-profile">
            <div class="profile-banner"></div>
            <div class="profile-body">
                <img id="viewAvatar" src="" class="profile-avatar">
                <h2 id="viewUsername">User</h2>
                <p id="viewBio" style="font-size: 13px; color: var(--text-muted);">...</p>
                <button onclick="openEditProfile()">Редактировать профиль</button>
            </div>
        </div>

        <div class="card">
            <h3>💬 Discord Nitro Full</h3>
            <p>Премиум подписка.</p>
            <button onclick="makeOrder('Nitro Full', '200$')">Заказать товар</button>
        </div>
    </div>

    <script>
        function registerUser() {
            const u = document.getElementById('regUsername').value;
            localStorage.setItem('art_user', u);
            localStorage.setItem('art_avatar', document.getElementById('regAvatar').value);
            localStorage.setItem('art_bio', document.getElementById('regBio').value);
            location.reload();
        }

        function loadProfile() {
            const u = localStorage.getItem('art_user');
            if (u) {
                document.getElementById('authModal').style.display = 'none';
                document.getElementById('viewUsername').innerText = u;
                document.getElementById('viewAvatar').src = localStorage.getItem('art_avatar');
                document.getElementById('viewBio').innerText = localStorage.getItem('art_bio');
            }
        }

        function openEditProfile() { document.getElementById('authModal').style.display = 'flex'; }
        
        async function makeOrder(prod, price) {
            const res = await fetch('/api/order', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({product: prod, price: price, discord: localStorage.getItem('art_user')})
            });
            alert('Заказ оформлен!');
        }

        loadProfile();
    </script>
</body>
</html
